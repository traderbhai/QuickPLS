[package]
name = "qpls-project"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
qpls-core = { path = "../qpls-core" }
qpls-data = { path = "../qpls-data" }
qpls-estimation = { path = "../qpls-estimation" }
qpls-assessment = { path = "../qpls-assessment" }
qpls-resampling = { path = "../qpls-resampling" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
statrs.workspace = true
thiserror.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
qpls-runner = { path = "../qpls-runner" }
tempfile.workspace = true
