name: QuickPLS strict restored-evidence verification

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run containing the exact identity-bound evidence ZIP
        required: true
        type: string
      artifact_name:
        description: Artifact name containing exactly one evidence ZIP
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: restored-evidence-${{ github.ref }}-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Restore into clean checkout and run strict gates
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r validation/requirements.txt

      - name: Download evidence from named repository run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: release/evidence-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Restore exact runtime evidence
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath release/evidence-input -File -Filter '*.zip')
          if ($bundles.Count -ne 1) {
            throw 'Strict restored-evidence verification requires exactly one ZIP.'
          }
          python validation/release_evidence_bundle.py restore --bundle $bundles[0].FullName

      - name: Run strict method and competitor gates
        shell: pwsh
        run: |
          python validation/method_promotion_manifest.py
          python validation/quickpls_3_competitor_program.py

      - name: Publish verification receipt
        shell: pwsh
        run: |
          $receipt = @{
            schema_version = 1
            passed = $true
            source_commit = $env:GITHUB_SHA
            source_run_id = '${{ inputs.source_run_id }}'
            artifact_name = '${{ inputs.artifact_name }}'
            strict_method_factory = $true
            strict_competitor_program = $true
            commercial_gate_satisfied = $false
            competitor_claims_authorized = $false
          }
          New-Item -ItemType Directory -Force -Path validation/results | Out-Null
          $receipt | ConvertTo-Json | Set-Content -LiteralPath validation/results/restored_evidence_verification.json -Encoding utf8NoBOM

      - name: Upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restored-evidence-verification-${{ github.sha }}-${{ inputs.source_run_id }}
          path: validation/results/restored_evidence_verification.json
          if-no-files-found: error
          retention-days: 90
