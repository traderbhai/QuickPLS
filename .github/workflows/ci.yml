name: QuickPLS CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Windows build and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install validation dependencies
        run: python -m pip install --require-hashes -r validation/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test -- --run

      - name: Frontend build
        run: npm run build

      - name: QuickPLS 3 competitor foundation tests
        run: >-
          python -m unittest
          validation.test_quickpls_3_competitor_contracts
          validation.test_method_promotion_contracts
          validation.test_quickpls_3_release_readiness
          validation.test_package_release_artifacts
          validation.test_quickpls_release_foundation
          validation.test_webview2_offline_containment
          validation.test_quickpls_3_operational_foundation
          validation.test_quickpls_supply_chain_evidence
          validation.test_quickpls_external_beta
          validation.test_quickpls_signed_candidate
          validation.test_parity_ledger

      - name: QuickPLS promotion mutation tests
        run: >-
          python validation/run_portable_method_promotion_tests.py &&
          python validation/run_portable_competitor_program_tests.py

      - name: QuickPLS release foundation
        run: >-
          npm run qpls:release:foundation &&
          npm run qpls:release:operational-foundation &&
          npm run qpls:release:external-beta

      - name: QuickPLS 3 competitor foundation
        run: >-
          python validation/method_promotion_contracts.py &&
          python validation/quickpls_3_competitor_contracts.py &&
          npm run qpls:competitor:release-readiness &&
          npm run qpls:release:operational-foundation &&
          npm run qpls:release:external-beta

      - name: Rust tests
        run: |
          cargo test -p qpls-core
          cargo test -p qpls-data
          cargo test -p qpls-project
          cargo test -p qpls-estimation
          cargo test -p qpls-assessment
          cargo test -p qpls-resampling
          cargo test -p qpls-runner
          cargo test -p qpls-cli
          cargo test -p quickpls-desktop

      - name: v1.0 gate
        run: cargo run -p qpls-cli -- gate v1_0_stable
