name: QuickPLS protected signed candidate

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Signed candidate channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      label:
        description: Unique immutable candidate label
        required: true
        type: string
      minimum_installed_version:
        description: Lowest version accepted by the signed updater manifest
        required: true
        type: string
      evidence_artifact_name:
        description: Identity-bound runtime evidence artifact for this exact commit
        required: true
        type: string
      evidence_source_run_id:
        description: Repository workflow run that published the evidence artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

env:
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_AUDIT_CRATE_SHA256: "700c2b240f7fd330c24b675fe429f73a5b676531fcc6300400b2b67f155ba12a"

concurrency:
  group: signed-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and assemble signed candidate
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: quickpls-signing
    timeout-minutes: 120
    env:
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
      QUICKPLS_SIGNER_EXECUTABLE: ${{ vars.QUICKPLS_SIGNER_EXECUTABLE }}

    steps:
      - name: Checkout protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Require protected branch context
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_PROTECTED -ne 'true') {
            throw 'Signed candidates require a protected main branch.'
          }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $prefix = '^v' + [regex]::Escape($version) + '[-_.]'
          if ('${{ inputs.channel }}' -eq 'stable' -and '${{ inputs.label }}' -notmatch $prefix) {
            throw "Stable candidate labels must begin with v$version plus a separator."
          }

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install locked project and scan dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r validation/requirements.txt
          python -m pip install --require-hashes -r validation/security-tools-requirements.txt
          cargo install cargo-audit --locked --version $env:CARGO_AUDIT_VERSION
          $toolVersion = (cargo-audit --version).Trim()
          if ($toolVersion -ne "cargo-audit $env:CARGO_AUDIT_VERSION") {
            throw "Unexpected cargo-audit executable version: $toolVersion"
          }
          $archives = @(Get-ChildItem -LiteralPath "$env:USERPROFILE/.cargo/registry/cache" -Recurse -File -Filter "cargo-audit-$env:CARGO_AUDIT_VERSION.crate")
          if ($archives.Count -eq 0) {
            throw 'Cargo did not retain the cargo-audit source archive for checksum verification.'
          }
          foreach ($archive in $archives) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
            if ($actual -ne $env:CARGO_AUDIT_CRATE_SHA256) {
              throw "cargo-audit source archive checksum differs: $actual"
            }
          }
          npm ci

      - name: Download identity-bound runtime evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: release/evidence-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_source_run_id }}

      - name: Require one evidence bundle and restore exact bytes
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath release/evidence-input -File -Filter '*.zip')
          if ($bundles.Count -ne 1) {
            throw 'The signed-candidate workflow requires exactly one evidence ZIP.'
          }
          python validation/release_evidence_bundle.py restore --bundle $bundles[0].FullName

      - name: Validate restored method evidence and require pending commercial state
        shell: pwsh
        run: |
          python validation/method_promotion_manifest.py
          $programLines = @(& python validation/quickpls_3_competitor_program.py)
          if ($LASTEXITCODE -ne 0) {
            $programLines | Write-Output
            throw 'The strict competitor program contract is invalid.'
          }
          $programText = $programLines -join [Environment]::NewLine
          $program = $programText | ConvertFrom-Json
          if ($program.passed -ne $true -or $program.competitor_ready -ne $false) {
            $programText | Write-Output
            throw 'Pre-sign validation must pass structurally while competitor_ready remains false.'
          }
          $programText | Write-Output

      - name: Run security, dependency, secret, and license gates
        shell: pwsh
        run: >-
          python validation/quickpls_security_scans.py
          --report validation/results/quickpls_security_scan_report.json

      - name: Run source and release-foundation gates
        shell: pwsh
        run: |
          npm test -- --run
          npm run build
          cargo test --workspace --locked
          npm run qpls:release:foundation
          npm run qpls:release:operational-foundation

      - name: Build unsigned PE inputs and offline installer payload
        id: build
        shell: pwsh
        run: |
          $started = [DateTimeOffset]::UtcNow.ToString('o')
          "started=$started" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          npm run tauri -- build --no-bundle
          cargo build --release --locked -p qpls-cli

      - name: Sign desktop and CLI with approved managed identity
        shell: pwsh
        run: |
          if (-not (Get-Command signtool.exe -ErrorAction SilentlyContinue)) {
            throw 'SignTool is not available on the protected signing runner.'
          }
          if (-not $env:QUICKPLS_SIGNER_EXECUTABLE) {
            throw 'The protected quickpls-signing environment must define QUICKPLS_SIGNER_EXECUTABLE.'
          }
          $signer = [IO.Path]::GetFullPath($env:QUICKPLS_SIGNER_EXECUTABLE)
          if (-not (Test-Path -LiteralPath $signer -PathType Leaf)) {
            throw 'The approved managed signer executable is unavailable.'
          }
          & $signer -- 'target/release/quickpls-desktop.exe' 'target/release/qpls.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Managed Authenticode signing failed.' }

      - name: Bundle installer containing signed binaries
        shell: pwsh
        run: npm run tauri -- bundle --bundles nsis

      - name: Sign final installer
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $installer = "target/release/bundle/nsis/QuickPLS_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Missing installer: $installer" }
          $signer = [IO.Path]::GetFullPath($env:QUICKPLS_SIGNER_EXECUTABLE)
          & $signer -- $installer
          if ($LASTEXITCODE -ne 0) { throw 'Managed installer signing failed.' }

      - name: Assemble and independently verify signed candidate
        shell: pwsh
        run: |
          $finished = [DateTimeOffset]::UtcNow.ToString('o')
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          python validation/quickpls_signed_candidate.py `
            --channel '${{ inputs.channel }}' `
            --label '${{ inputs.label }}' `
            --minimum-installed-version '${{ inputs.minimum_installed_version }}' `
            --build-started-at '${{ steps.build.outputs.started }}' `
            --build-finished-at $finished `
            --desktop target/release/quickpls-desktop.exe `
            --cli target/release/qpls.exe `
            --installer "target/release/bundle/nsis/QuickPLS_${version}_x64-setup.exe" `
            --output-dir release/candidates

      - name: Stable requires complete commercial and aggregate gates
        if: inputs.channel == 'stable'
        shell: pwsh
        run: |
          python validation/quickpls_3_release_readiness.py --require-ready
          python validation/quickpls_3_competitor_program.py --require-ready

      - name: Upload immutable candidate review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quickpls-${{ inputs.channel }}-${{ inputs.label }}-${{ github.sha }}
          path: |
            release/candidates/**
            validation/results/quickpls_security_scan_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve failure evidence without publishing
        if: failure() && hashFiles('validation/results/quickpls_security_scan_report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quickpls-failed-candidate-evidence-${{ github.run_id }}
          path: validation/results/quickpls_security_scan_report.json
          if-no-files-found: ignore
          retention-days: 30
